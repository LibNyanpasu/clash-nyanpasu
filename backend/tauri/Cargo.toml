[package]
name = "clash-nyanpasu"
version = "0.1.0"
description = "clash verge"
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
default-run = "clash-nyanpasu"
edition = { workspace = true }
build = "build.rs"

[lib]
name = "clash_nyanpasu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.1", features = [] }
serde = "1"
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = "0.4"
rustc_version = "0.4"
semver = "1.0"

[dependencies]
# Local Dependencies
nyanpasu-ipc = { workspace = true }
nyanpasu-logging = { path = "../nyanpasu-runtime/crates/nyanpasu-logging", features = [
  "specta",
] }
nyanpasu-core-manager = { workspace = true }
clash-api = { workspace = true }
nyanpasu-macro = { path = "../nyanpasu-macro" }
nyanpasu-core = { path = "../nyanpasu-core" }
nyanpasu-config = { path = "../nyanpasu-config" }
nyanpasu-utils = { workspace = true }
nyanpasu-egui = { path = "../nyanpasu-egui" }

# Common Utilities
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { version = "0.7", features = ["full"] }
oneshot = "0.2"
futures = "0.3"
futures-util = "0.3"
glob = "0.3.1"
timeago = "0.6"
humansize = "2.1.3"
convert_case = "0.12.0"
anyhow = "1.0"
pretty_assertions = "1.4.0"
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
once_cell = "1.19.0"
async-trait = "0.1.77"
dyn-clone = "1.0.16"
thiserror = { workspace = true }
parking_lot = { version = "0.12.1" }
fs-err = { workspace = true }                                             # for more detailed io error
itertools = "0.15"                                                        # sweet iterator utilities
rayon = "1.10"                                                            # for iterator parallel processing
ambassador = "0.5.0"                                                      # for trait delegation
strum = { version = "0.28", features = ["derive"] }                       # for enum string conversion
struct-patch = "0.14"
atomic_enum = "0.3.0"                                                     # for atomic enum
enumflags2 = "0.7"                                                        # for enum flags
backon = { version = "1.0.1", features = ["tokio-sleep"] }                # for backoff retry
ractor = "0.16"

# Data Structures
dashmap = "6"
indexmap = { version = "2.2.3", features = ["serde"] }
bimap = "0.6.3"
rustc-hash = "2.1"

# Terminal Utilities
ansi-str = "0.9"                                    # for ansi str stripped
ctrlc = "3.4.2"
colored = "3"
clap = { version = "4.5.4", features = ["derive"] }

# GUI Utilities
rfd = { version = "0.15", default-features = false, features = [
  "tokio",
  "gtk3",
  "common-controls-v6",
] } # cross platform dialog

# Internationalization
rust-i18n = "4"

# Networking Libraries
axum = "0.8"
url = "2"
mime = "0.3"
reqwest = { workspace = true }
# Parallel/concurrent download engine. We disable the bundled reqwest adapter
# (it targets reqwest 0.13 while this workspace pins 0.12) and implement our own
# BoltLoadAdapter over the existing reqwest 0.12 client in `core::download`.
bolt-load = { version = "0.1", default-features = false, features = [
  "tokio",
  "serde",
  "tracing",
] }
# the CancellationToken type required by bolt-load's TaskBuilder
smol-cancellation-token = "0.1"
urlencoding = "2.1"
port_scanner = "0.1.5"
sysproxy = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# Kept as a direct dependency rather than inherited: Cargo's workspace
# inheritance does not allow `package` renames at the member site.
serde_yaml = { version = "0.10", package = "serde_yaml_ng", git = "https://github.com/libnyanpasu/serde-yaml-ng.git", rev = "363da138dc97f90ef0a356f971c2dc1d8fe04c9e", features = [
  "specta",
] }
postcard = { version = "1.1", features = ["alloc"] }
bytes = { version = "1", features = ["serde"] }
semver = "1.0"

# Compression & Encoding
flate2 = "1.0"
zip = "8.0.0"
zip-extensions = "0.14.0"
base64 = "0.23"
hex = "0.4"
percent-encoding = "2.3.1"

# Algorithms
uuid = "1.7.0"
rand = "0.10"
md-5 = "0.11.0"
sha2 = "0.10"
nanoid = "0.5.0"
rs-snowflake = "0.6"
seahash = "4.1"

# System Utilities
auto-launch = { workspace = true }
delay_timer = { workspace = true }                    # Task scheduler with timer
dunce = "1.0.4"                                       # for cross platform path normalization
runas = { workspace = true }
single-instance = "0.3.3"
which = "8"
open = "5.0.1"
sysinfo = "0.39"
os_pipe = "1.2.1"
whoami = "2.0.0"
camino = { version = "1.1.9", features = ["serde1"] }

# IO Utilities
dirs = "7"
atomicwrites = "0.4.4"          # crash-safe temp-file + durable rename writes
tempfile = "3.9.0"
fs_extra = "1.3.0"
notify-debouncer-full = "0.7.0"
notify = "8.0.0"

# Database
redb = "4.0.0"

# Logging & Tracing
log = "0.4.20"
tracing = { workspace = true }
tracing-attributes = "0.1"
tracing-futures = "0.2"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "parking_lot",
] }
tracing-error = "0.2"
tracing-log = { version = "0.2" }
tracing-appender = { version = "0.2", features = ["parking_lot"] }
test-log = { workspace = true }
tracing-test = { workspace = true }

# Image & Graphics
image = "0.25.5"
fast_image_resize = "6"
display-info = "0.5.0"  # should be removed after upgrading to tauri v2

# OXC (The Oxidation Compiler)
# We use it to parse and transpile the old script profile to esm based script profile
oxc_parser = "0.149"
oxc_allocator = "0.149"
oxc_span = "0.149"
oxc_ast = "0.149"
oxc_syntax = "0.149"
oxc_ast_visit = "0.149"

# Lua Integration
mlua = { version = "0.12", features = [
  "lua54",
  "async",
  "serialize",
  "vendored",
  "error-send",
] }

# JavaScript Integration
boa_utils = { path = "../boa_utils" }                     # should be removed when boa support console customize
boa_engine = { workspace = true, features = ["annex-b"] }

# Tauri Dependencies
tauri = { version = "2.4", features = [
  "tray-icon",
  "image-png",
  "image-ico",
  "rustls-tls",
  "specta",
] }
tauri-plugin-deep-link = { path = "../tauri-plugin-deep-link", version = "0.1.2" } # This should be migrated to official tauri plugin
tauri-plugin-os = "2.2"
tauri-plugin-clipboard-manager = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-process = "2.2"
tauri-plugin-updater = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-opener = "2.5"
window-vibrancy = { version = "0.8.0" }

# Strong typed api binding between typescript and rust
# tauri-specta-query's current release line targets Specta rc26; this revision
# is the compatible rc25 line used by the project today.
specta-typescript = { version = "0.0.12", features = ["serde"] }
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta.git", rev = "373c25d080aa0ba909bd23b2b559947079e8dc75", version = "2.0.0-rc.25", features = [
  "derive",
  "typescript",
] }
tauri-specta-query = { git = "https://github.com/specta-rs/tauri-specta.git", rev = "373c25d080aa0ba909bd23b2b559947079e8dc75", version = "0.0.0" }
specta = { version = "^2.0.0-rc.25", features = [
  "serde_json",
  "serde_yaml",
  "uuid",
  "url",
  "indexmap",
  "function",
] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.1", features = [
  "NSApplication",
  "NSColor",
  "NSColorSpace",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
  "NSView",
] }
objc2-foundation = { version = "0.3.1", features = ["NSGeometry"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.0", features = ["user", "fs"] }

[target.'cfg(windows)'.dependencies]
deelevate = "0.2.0"
winreg = { version = "0.56", features = ["transactions"] }
windows-registry = "0.100.0"
windows-sys = { version = "0.61", features = [
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Shutdown",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
] }
# windows-core and webview2-com must stay in lockstep with the versions used
# by tauri/wry, since we cast COM interfaces obtained from tauri's webview.
windows-core = "0.100"
webview2-com = "0.39"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
mockall = "0.15"
# Test-only protocol helpers + binary discovery for later process-lifecycle
# matrix tests. A dev-dependency does NOT build the fake-core binary and does
# NOT set CARGO_BIN_EXE_fake-core for this package. Prebuild with
# `cargo build -p fake-core` (or `cargo test -p fake-core`), then resolve via
# `fake_core::require_bin_path()` (current_exe profile/triple lookup, non-empty
# NYANPASU_FAKE_CORE override, then target-dir fallback).
fake-core = { path = "../fake-core" }

[features]
default = ["custom-protocol", "default-meta"]
nightly = ["devtools", "deadlock-detection"]
custom-protocol = ["tauri/custom-protocol"]
verge-dev = []
default-meta = []
devtools = ["tauri/devtools"]
deadlock-detection = ["parking_lot/deadlock_detection"]
